schema_version: 1
project: personal-intelligence-action-engine
execution_model:
  unit_of_work: one task
  status_file: planning/status.yaml
  run_record_directory: planning/runs
  valid_states:
  - NOT_STARTED
  - IN_PROGRESS
  - DONE
  - NO_CHANGE_REQUIRED
  - BLOCKED
  - FAILED_VERIFICATION
  required_precheck:
  - inspect current state
  - verify dependencies
  - reproduce missing capability
  - consider NO_CHANGE_REQUIRED
  required_postcheck:
  - run verification
  - record acceptance evidence
  - independent review
  - update status only after PASS
  prohibited:
  - git push
  - production deployment
  - destructive migration without approval
  - secret creation or disclosure
  - acceptance-criteria weakening
phases:
- id: P0
  name: Repository, governance, and engineering foundation
  objective: Create a reproducible, secure, observable development foundation.
  gate: P0-GATE
- id: P1
  name: Identity, tenancy, storage, and core platform
  objective: Establish authorization, persistence, storage, jobs, and audit boundaries.
  gate: P1-GATE
- id: P2
  name: Knowledge ingestion and hybrid retrieval
  objective: Ingest approved files into versioned authorized knowledge and retrieve it measurably.
  gate: P2-GATE
- id: P3
  name: Source-grounded conversational assistant
  objective: Deliver the first production-capable private assistant over approved knowledge.
  gate: P3-GATE
- id: P4
  name: Governed persistent memory
  objective: Add controlled durable personalization and project memory.
  gate: P4-GATE
- id: P5
  name: Tool gateway, approvals, and controlled actions
  objective: Enable useful actions with independent policy, approval, and idempotent execution.
  gate: P5-GATE
- id: P6
  name: Portable evaluation and controlled improvement
  objective: Turn traces and feedback into evaluated, reversible candidate improvements.
  gate: P6-GATE
- id: P7
  name: Production hardening and operational readiness
  objective: Prepare the system for sustained private or organizational deployment.
  gate: P7-GATE
tasks:
- id: P0-T01
  phase: P0
  title: Initialize monorepo and pin toolchain
  objective: Create the workspace, application shells, package boundaries, and deterministic developer toolchain.
  depends_on: []
  requirements:
  - NFR-MNT-001
  - NFR-MNT-006
  spec_refs:
  - docs/02_ARCHITECTURE.md#2-technology-baseline
  - docs/02_ARCHITECTURE.md#4-repository-layout
  allowed_paths:
  - package.json
  - pnpm-workspace.yaml
  - pnpm-lock.yaml
  - turbo.json
  - .tool-versions
  - .nvmrc
  - tsconfig*.json
  - apps/**
  - packages/**
  forbidden_paths:
  - infra/terraform/prod/**
  - .env
  - '**/*secret*'
  inputs:
  - Authoritative specifications
  - Current repository state
  - Dependency run records
  outputs:
  - Installable monorepo
  - web/api/worker shells
  - strict shared TypeScript config
  - canonical scripts
  implementation_notes:
  - Select supported stable versions, record them in tool-version files, and commit the resolved lockfile.
  - Keep provider SDKs out of domain packages.
  verification:
  - pnpm install --frozen-lockfile
  - pnpm typecheck
  - pnpm lint
  - pnpm test:unit
  - pnpm build
  acceptance:
  - Clean checkout installs with the committed lockfile.
  - '`pnpm typecheck`, `pnpm lint`, `pnpm test:unit`, and `pnpm build` execute successfully.'
  - Application shells contain no product-specific shortcuts that violate package boundaries.
  security_checks:
  - No secrets are introduced.
  - Workspace scoping is preserved where tenant data is involved.
  rollback:
  - Revert task-scoped code and configuration changes.
  - Do not destroy persisted user data.
  stop_conditions:
  - A required dependency is not DONE or NO_CHANGE_REQUIRED.
  - A specification conflict changes public behavior or security semantics.
  - A real credential, production account, destructive operation, or external side effect is required.
  parallel_group: null
  required_reviewers:
  - reviewer
- id: P0-T02
