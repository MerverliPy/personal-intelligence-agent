  - Current repository state
  - Dependency run records
  outputs:
  - Typed configuration package
  - safe `.env.example`
  - configuration tests
  implementation_notes: []
  verification:
  - pnpm typecheck
  - pnpm lint
  - pnpm test:unit
  acceptance:
  - Every process validates configuration before serving work.
  - Error messages name missing keys but never print secret values.
  - Test and local defaults cannot be used silently in production mode.
  security_checks:
  - Secrets are represented only by names/references in examples.
  - Configuration logging is redacted.
  rollback:
  - Revert task-scoped code and configuration changes.
  - Do not destroy persisted user data.
  stop_conditions:
  - A required dependency is not DONE or NO_CHANGE_REQUIRED.
  - A specification conflict changes public behavior or security semantics.
