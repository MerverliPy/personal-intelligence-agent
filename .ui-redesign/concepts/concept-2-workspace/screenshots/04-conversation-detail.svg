<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="-apple-system, system-ui, sans-serif">
  <rect width="393" height="852" fill="#F5F3EE"/>

  <rect x="134.5" y="11" width="124" height="37" rx="18.5" fill="#000000"/>

  <line x1="0" y1="95" x2="393" y2="95" stroke="#E5E0D8" stroke-width="0.5"/>
  <circle cx="24" cy="68" r="18" fill="#2563EB"/>
  <text x="24" y="74" font-size="17" font-weight="700" fill="white" text-anchor="middle">P</text>
  <text x="196.5" y="74" font-size="20" font-weight="700" fill="#1F1B16" text-anchor="middle">Conversation</text>

  <!-- Back button -->
  <g transform="translate(8, 50)" stroke="#2563EB" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,5 L7,11 L14,17"/>
  </g>

  <!-- User message -->
  <g transform="translate(0, 120)">
    <rect x="180" y="0" width="197" height="50" rx="14" fill="#2563EB"/>
    <text x="190" y="20" font-size="17" fill="white">What is the</text>
    <text x="190" y="40" font-size="17" fill="white">retention period?</text>
  </g>

  <!-- Assistant message with filled-blue citation chips -->
  <g transform="translate(16, 195)">
    <text x="0" y="20" font-size="17" fill="#1F1B16">The retention period is 7 years</text>
    <!-- Citation 1 (filled blue pill) -->
    <g transform="translate(196, 7)">
      <rect x="0" y="0" width="20" height="20" rx="5" fill="#2563EB"/>
      <text x="10" y="15" font-size="13" font-weight="700" fill="white" text-anchor="middle">1</text>
    </g>
    <text x="220" y="20" font-size="17" fill="#1F1B16">.</text>
    <text x="0" y="48" font-size="17" fill="#1F1B16">This applies to all records</text>
    <text x="0" y="76" font-size="17" fill="#1F1B16">ingested under the standard policy</text>
    <g transform="translate(220, 63)">
      <rect x="0" y="0" width="20" height="20" rx="5" fill="#2563EB"/>
      <text x="10" y="15" font-size="13" font-weight="700" fill="white" text-anchor="middle">2</text>
    </g>
    <text x="244" y="76" font-size="17" fill="#1F1B16">.</text>

    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="84" height="22" rx="4" fill="#DCFCE7"/>
      <text x="42" y="15" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">COMPLETED</text>
      <text x="98" y="15" font-size="13" fill="#6B6660" text-decoration="underline">Feedback</text>
    </g>
  </g>

  <!-- Composer -->
  <line x1="0" y1="687" x2="393" y2="687" stroke="#E5E0D8" stroke-width="0.5"/>
  <g transform="translate(12, 695)">
    <rect x="0" y="0" width="293" height="56" rx="18" fill="white" stroke="#E5E0D8" stroke-width="0.5"/>
    <text x="14" y="34" font-size="17" fill="#A09C95">Message</text>
    <circle cx="333" cy="28" r="28" fill="#2563EB"/>
    <path d="M328,18 L343,28 L333,40 Z" fill="white" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Tab bar (no current — we're on detail) -->
  <line x1="0" y1="762" x2="393" y2="762" stroke="#E5E0D8" stroke-width="0.5"/>
  <g transform="translate(0, 762)">
    <rect x="0" y="0" width="98" height="56" fill="none"/>
    <g transform="translate(49, 18)" stroke="#6B6660" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6,-9 h5 l4,4 v9 a1,1 0 0 1 -1,1 h-8 a1,1 0 0 1 -1,-1 v-12 a1,1 0 0 1 1,-1 z"/>
      <path d="M-1,-9 v4 h4"/>
      <path d="M-3,1 h5 M-3,4 h4"/>
    </g>
    <text x="49" y="48" font-size="10" font-weight="600" fill="#6B6660" text-anchor="middle">Documents</text>
    <rect x="98" y="0" width="98" height="56" fill="none"/>
    <g transform="translate(147, 18)" stroke="#6B6660" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-1" cy="-1" r="5"/>
      <line x1="3" y1="3" x2="7" y2="7"/>
    </g>
    <text x="147" y="48" font-size="10" font-weight="600" fill="#6B6660" text-anchor="middle">Search</text>
    <rect x="196" y="0" width="98" height="56" fill="none"/>
    <g transform="translate(245, 18)" stroke="#6B6660" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9,-3 a2,2 0 0 1 2,-2 h10 a2,2 0 0 1 2,2 v6 a2,2 0 0 1 -2,2 h-7 l-3,2 v-2 h0 a2,2 0 0 1 -2,-2 z"/>
    </g>
    <text x="245" y="48" font-size="10" font-weight="600" fill="#6B6660" text-anchor="middle">Conversations</text>
    <rect x="294" y="0" width="99" height="56" fill="none"/>
    <g transform="translate(343, 18)" stroke="#6B6660" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-8 l7,4 -7,4 -7,-4 z"/>
      <path d="M-7,0 l7,4 7,-4"/>
    </g>
    <text x="343" y="48" font-size="10" font-weight="600" fill="#6B6660" text-anchor="middle">Workspace</text>
  </g>
  <rect x="129.5" y="841" width="134" height="5" rx="2.5" fill="#000000"/>

  <text x="16" y="838" font-size="9" fill="#A09C95">Workspace — Conversation detail with filled-blue citation chips</text>
</svg>
