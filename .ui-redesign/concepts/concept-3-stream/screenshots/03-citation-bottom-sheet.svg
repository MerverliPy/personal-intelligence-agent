<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="-apple-system, system-ui, sans-serif">
  <!-- Faded backdrop of the conversation detail -->
  <rect width="393" height="852" fill="#000000" opacity="0.4"/>

  <!-- Faded thread behind the sheet (peek) -->
  <g opacity="0.4">
    <rect x="180" y="110" width="197" height="48" rx="22" fill="#2563EB"/>
    <text x="190" y="139" font-size="19" fill="white">What is the retention period?</text>
    <text x="32" y="243" font-size="19" fill="#0A0A0A">The retention period is 7 years</text>
  </g>

  <!-- Bottom sheet panel -->
  <g>
    <path d="M0,310 L393,310 L393,852 L0,852 Z" fill="#FFFFFF"/>
    <path d="M0,310 L393,310 L393,322 Q393,310 381,310 L12,310 Q0,310 0,322 Z" fill="#FFFFFF"/>

    <!-- Handle -->
    <rect x="178.5" y="326" width="36" height="5" rx="2.5" fill="#D0D0CC"/>

    <!-- Eyebrow (caption, muted, uppercase) -->
    <text x="16" y="358" font-size="14" font-weight="700" fill="#5C5C5C" letter-spacing="0.05em">CITATION 1 OF 2</text>

    <!-- Title -->
    <text x="16" y="390" font-size="24" font-weight="700" fill="#0A0A0A">Source</text>

    <!-- Source / Locator / Verification dl -->
    <g transform="translate(16, 410)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#5C5C5C" letter-spacing="0.04em">SOURCE</text>
      <text x="84" y="0" font-size="19" fill="#0A0A0A">policy-v3</text>
      <text x="0" y="32" font-size="11" font-weight="700" fill="#5C5C5C" letter-spacing="0.04em">LOCATOR</text>
      <text x="84" y="32" font-size="19" fill="#0A0A0A">page 1</text>
      <text x="0" y="64" font-size="11" font-weight="700" fill="#5C5C5C" letter-spacing="0.04em">VERIFICATION</text>
      <text x="84" y="64" font-size="19" fill="#0A0A0A">VERIFIED</text>
    </g>

    <!-- Claim heading -->
    <text x="16" y="510" font-size="14" font-weight="700" fill="#5C5C5C" letter-spacing="0.05em">CLAIM</text>

    <!-- Claim blockquote (blue left border) -->
    <line x1="16" y1="522" x2="18" y2="580" stroke="#2563EB" stroke-width="2"/>
    <text x="28" y="540" font-size="19" fill="#0A0A0A">The retention period</text>
    <text x="28" y="566" font-size="19" fill="#0A0A0A">is 7 years.</text>

    <!-- Open source primary button (PIA blue) -->
    <g transform="translate(16, 700)">
      <rect x="0" y="0" width="361" height="50" rx="10" fill="#2563EB"/>
      <text x="180.5" y="32" font-size="19" font-weight="600" fill="white" text-anchor="middle">Open source</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="129.5" y="841" width="134" height="5" rx="2.5" fill="#000000"/>
  <text x="16" y="838" font-size="9" fill="#5C5C5C" opacity="0.7">Stream — Citation bottom sheet (T2 = A)</text>
</svg>
