<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="-apple-system, system-ui, sans-serif">
  <rect width="393" height="852" fill="#FFFFFF"/>

  <!-- Dynamic Island -->
  <rect x="134.5" y="11" width="124" height="37" rx="18.5" fill="#000000"/>

  <!-- Header -->
  <line x1="0" y1="91" x2="393" y2="91" stroke="#ECECEC" stroke-width="0.5"/>
  <circle cx="24" cy="68" r="16" fill="#2563EB"/>
  <text x="24" y="74" font-size="16" font-weight="700" fill="white" text-anchor="middle">P</text>
  <text x="196.5" y="74" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Search</text>

  <!-- Sticky search input (44pt) -->
  <g transform="translate(16, 99)">
    <rect x="0" y="0" width="361" height="44" rx="12" fill="#FFFFFF" stroke="#ECECEC" stroke-width="0.5"/>
    <g transform="translate(14, 22)" stroke="#5C5C5C" fill="none" stroke-width="1.6" stroke-linecap="round">
      <circle cx="0" cy="0" r="6"/>
      <line x1="4.5" y1="4.5" x2="9" y2="9"/>
    </g>
    <text x="40" y="29" font-size="19" fill="#9C9C9C">retention</text>
  </g>

  <!-- Result 1 -->
  <g transform="translate(0, 159)">
    <text x="32" y="24" font-size="14" font-weight="600" fill="#5C5C5C">1</text>
    <text x="56" y="24" font-size="19" fill="#0A0A0A">The retention period for all</text>
    <text x="56" y="48" font-size="19" fill="#0A0A0A">records is 7 years.</text>
    <g transform="translate(56, 64)">
      <rect x="0" y="0" width="50" height="22" rx="4" fill="#DCFCE7"/>
      <text x="25" y="15" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">READY</text>
      <text x="58" y="15" font-size="14" fill="#5C5C5C">page 1</text>
      <text x="100" y="15" font-size="14" fill="#9C9C9C">·</text>
      <text x="110" y="15" font-size="14" fill="#5C5C5C">Fuse 0.943</text>
    </g>
    <line x1="16" y1="110" x2="377" y2="110" stroke="#ECECEC" stroke-width="0.5"/>
  </g>

  <!-- Result 2 -->
  <g transform="translate(0, 269)">
    <text x="32" y="24" font-size="14" font-weight="600" fill="#5C5C5C">2</text>
    <text x="56" y="24" font-size="19" fill="#0A0A0A">Artificial intelligence and</text>
    <text x="56" y="48" font-size="19" fill="#0A0A0A">machine learning are transforming</text>
    <text x="56" y="72" font-size="19" fill="#0A0A0A">industries.</text>
    <g transform="translate(56, 88)">
      <rect x="0" y="0" width="50" height="22" rx="4" fill="#DCFCE7"/>
      <text x="25" y="15" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">READY</text>
      <text x="58" y="15" font-size="14" fill="#5C5C5C">page 4</text>
      <text x="100" y="15" font-size="14" fill="#9C9C9C">·</text>
      <text x="110" y="15" font-size="14" fill="#5C5C5C">Fuse 0.871</text>
    </g>
    <line x1="16" y1="134" x2="377" y2="134" stroke="#ECECEC" stroke-width="0.5"/>
  </g>

  <!-- Result 3 -->
  <g transform="translate(0, 403)">
    <text x="32" y="24" font-size="14" font-weight="600" fill="#5C5C5C">3</text>
    <text x="56" y="24" font-size="19" fill="#0A0A0A">Today the weather is sunny</text>
    <text x="56" y="48" font-size="19" fill="#0A0A0A">with a high of 75 degrees.</text>
    <g transform="translate(56, 64)">
      <rect x="0" y="0" width="50" height="22" rx="4" fill="#DCFCE7"/>
      <text x="25" y="15" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">READY</text>
      <text x="58" y="15" font-size="14" fill="#5C5C5C">page 1</text>
      <text x="100" y="15" font-size="14" fill="#9C9C9C">·</text>
      <text x="110" y="15" font-size="14" fill="#5C5C5C">Fuse 0.812</text>
    </g>
    <line x1="16" y1="110" x2="377" y2="110" stroke="#ECECEC" stroke-width="0.5"/>
  </g>

  <!-- Empty space hint -->
  <g transform="translate(0, 530)">
    <text x="32" y="24" font-size="14" font-weight="600" fill="#5C5C5C">4</text>
    <text x="56" y="24" font-size="19" fill="#0A0A0A">Retention applies to all categories</text>
    <text x="56" y="48" font-size="19" fill="#0A0A0A">of records under the policy.</text>
    <g transform="translate(56, 64)">
      <rect x="0" y="0" width="50" height="22" rx="4" fill="#DCFCE7"/>
      <text x="25" y="15" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">READY</text>
      <text x="58" y="15" font-size="14" fill="#5C5C5C">page 2</text>
      <text x="100" y="15" font-size="14" fill="#9C9C9C">·</text>
      <text x="110" y="15" font-size="14" fill="#5C5C5C">Fuse 0.789</text>
    </g>
    <line x1="16" y1="110" x2="377" y2="110" stroke="#ECECEC" stroke-width="0.5"/>
  </g>

  <!-- Bottom tab bar -->
  <line x1="0" y1="769" x2="393" y2="769" stroke="#ECECEC" stroke-width="0.5"/>
  <g transform="translate(0, 769)">
    <rect x="0" y="0" width="131" height="49" fill="none"/>
    <g transform="translate(65.5, 14)" stroke="#5C5C5C" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12,-2 a3,3 0 0 1 3,-3 h18 a3,3 0 0 1 3,3 v8 a3,3 0 0 1 -3,3 h-9 l-5,4 v-4 h-1 a3,3 0 0 1 -3,-3 z"/>
    </g>
    <text x="65.5" y="42" font-size="10" font-weight="600" fill="#5C5C5C" text-anchor="middle">Conversations</text>
    <rect x="131" y="0" width="131" height="49" fill="none"/>
    <g transform="translate(196.5, 14)" stroke="#5C5C5C" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-7,-10 h6 l4,4 v10 a2,2 0 0 1 -2,2 h-8 a2,2 0 0 1 -2,-2 v-12 a2,2 0 0 1 2,-2 z"/>
      <path d="M-1,-10 v4 h4"/>
      <path d="M-5,0 h8 M-5,4 h6"/>
    </g>
    <text x="196.5" y="42" font-size="10" font-weight="600" fill="#5C5C5C" text-anchor="middle">Documents</text>
    <rect x="262" y="0" width="131" height="49" fill="none"/>
    <line x1="301" y1="0" x2="354" y2="0" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(327.5, 14)" stroke="#2563EB" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-2" cy="-2" r="6"/>
      <line x1="2.5" y1="2.5" x2="7" y2="7"/>
    </g>
    <text x="327.5" y="42" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">Search</text>
  </g>

  <!-- Home indicator -->
  <rect x="129.5" y="841" width="134" height="5" rx="2.5" fill="#000000"/>
  <text x="16" y="838" font-size="9" fill="#5C5C5C" opacity="0.6">Stream — Search tab (T3 = A) with single Fuse score</text>
</svg>
