<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="-apple-system, system-ui, sans-serif">
  <rect width="393" height="852" fill="#FFFFFF"/>

  <!-- Dynamic Island -->
  <rect x="134.5" y="11" width="124" height="37" rx="18.5" fill="#000000"/>

  <!-- Header (back button + title) -->
  <line x1="0" y1="91" x2="393" y2="91" stroke="#ECECEC" stroke-width="0.5"/>
  <!-- Back chevron (44pt target) -->
  <g transform="translate(8, 47)" stroke="#2563EB" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,5 L7,11 L14,17"/>
  </g>
  <text x="196.5" y="68" font-size="19" font-weight="700" fill="#0A0A0A" text-anchor="middle">What is the retention period?</text>

  <!-- Message thread (single pane, T2=A) -->
  <!-- User message (right-aligned, blue bubble) -->
  <g transform="translate(0, 110)">
    <rect x="180" y="0" width="197" height="48" rx="22" fill="#2563EB"/>
    <text x="190" y="29" font-size="19" fill="white">What is the retention period?</text>
  </g>

  <!-- Assistant message 1 — with footnote-style [1][2] chips -->
  <g transform="translate(16, 195)">
    <text x="0" y="14" font-size="11" font-weight="700" fill="#5C5C5C" letter-spacing="0.06em">PIA · POLICY-V3</text>

    <text x="0" y="48" font-size="19" fill="#0A0A0A">
      <tspan>The retention period is 7 years</tspan>
      <tspan fill="#2563EB" text-decoration="underline" dx="1" font-weight="600" font-size="16">[1]</tspan>
      <tspan>.</tspan>
    </text>
    <text x="0" y="78" font-size="19" fill="#0A0A0A">
      <tspan>This applies to all records ingested under the</tspan>
    </text>
    <text x="0" y="108" font-size="19" fill="#0A0A0A">
      <tspan>standard policy</tspan>
      <tspan fill="#2563EB" text-decoration="underline" dx="1" font-weight="600" font-size="16">[2]</tspan>
      <tspan>.</tspan>
    </text>

    <!-- Status + feedback row -->
    <g transform="translate(0, 132)">
      <rect x="0" y="0" width="92" height="22" rx="4" fill="#DCFCE7"/>
      <text x="46" y="15" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">COMPLETED</text>
      <text x="104" y="15" font-size="14" fill="#5C5C5C">·</text>
      <text x="114" y="15" font-size="14" fill="#5C5C5C">231 ms</text>
      <text x="160" y="15" font-size="14" fill="#5C5C5C">·</text>
      <text x="170" y="15" font-size="14" fill="#5C5C5C" text-decoration="underline">Feedback</text>
    </g>
  </g>

  <!-- Composer (56pt tall, T5=A text-only) — sticky at bottom -->
  <line x1="0" y1="687" x2="393" y2="687" stroke="#ECECEC" stroke-width="0.5"/>
  <g transform="translate(12, 695)">
    <rect x="0" y="0" width="305" height="56" rx="22" fill="#FFFFFF" stroke="#ECECEC" stroke-width="0.5"/>
    <text x="16" y="34" font-size="19" fill="#9C9C9C">Ask, research, analyze…</text>
    <circle cx="345" cy="28" r="28" fill="#2563EB"/>
    <path d="M338,28 L352,28 M345,21 L345,35" stroke="white" stroke-width="2.2" stroke-linecap="round" transform="rotate(45 345 28)"/>
  </g>

  <!-- Bottom tab bar (49pt + safe area 34pt = 83pt) -->
  <line x1="0" y1="769" x2="393" y2="769" stroke="#ECECEC" stroke-width="0.5"/>
  <g transform="translate(0, 769)">
    <rect x="0" y="0" width="131" height="49" fill="none"/>
    <g transform="translate(65.5, 14)" stroke="#5C5C5C" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12,-2 a3,3 0 0 1 3,-3 h18 a3,3 0 0 1 3,3 v8 a3,3 0 0 1 -3,3 h-9 l-5,4 v-4 h-1 a3,3 0 0 1 -3,-3 z"/>
    </g>
    <text x="65.5" y="42" font-size="10" font-weight="600" fill="#5C5C5C" text-anchor="middle">Conversations</text>
    <rect x="131" y="0" width="131" height="49" fill="none"/>
    <g transform="translate(196.5, 14)" stroke="#5C5C5C" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-7,-10 h6 l4,4 v10 a2,2 0 0 1 -2,2 h-8 a2,2 0 0 1 -2,-2 v-12 a2,2 0 0 1 2,-2 z"/>
      <path d="M-1,-10 v4 h4"/>
      <path d="M-5,0 h8 M-5,4 h6"/>
    </g>
    <text x="196.5" y="42" font-size="10" font-weight="600" fill="#5C5C5C" text-anchor="middle">Documents</text>
    <rect x="262" y="0" width="131" height="49" fill="none"/>
    <g transform="translate(327.5, 14)" stroke="#5C5C5C" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-2" cy="-2" r="6"/>
      <line x1="2.5" y1="2.5" x2="7" y2="7"/>
    </g>
    <text x="327.5" y="42" font-size="10" font-weight="600" fill="#5C5C5C" text-anchor="middle">Search</text>
  </g>

  <!-- Home indicator -->
  <rect x="129.5" y="841" width="134" height="5" rx="2.5" fill="#000000"/>
  <text x="16" y="838" font-size="9" fill="#5C5C5C" opacity="0.6">Stream — Conversation detail with footnote chips (T2 = A)</text>
</svg>
