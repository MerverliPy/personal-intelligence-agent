<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" font-family="-apple-system, system-ui, sans-serif">
  <rect width="393" height="852" fill="#FAFAF7"/>

  <!-- Faded conversation list (under sheet) -->
  <rect width="393" height="852" fill="#000000" opacity="0.4"/>

  <!-- Bottom sheet (workspace switcher) -->
  <g>
    <path d="M0,540 L393,540 L393,852 L0,852 Z" fill="#FAFAF7"/>
    <path d="M0,540 L393,540 L393,552 Q393,540 381,540 L12,540 Q0,540 0,552 Z" fill="#FAFAF7"/>

    <!-- Handle -->
    <rect x="178.5" y="556" width="36" height="5" rx="2.5" fill="#D0D0CC"/>

    <!-- Title + subtitle -->
    <text x="16" y="590" font-size="22" font-weight="700" fill="#000000">Workspaces</text>
    <text x="16" y="612" font-size="13" fill="#6B6B68">dev@localhost</text>

    <!-- Active row -->
    <g transform="translate(16, 632)">
      <circle cx="16" cy="16" r="16" fill="#000000"/>
      <text x="16" y="22" font-size="14" font-weight="600" fill="#FAFAF7" text-anchor="middle">P</text>
      <text x="44" y="22" font-size="17" font-weight="600" fill="#000000">PIA Workspace</text>
      <text x="361" y="22" font-size="18" font-weight="600" fill="#000000" text-anchor="end">✓</text>
      <line x1="0" y1="44" x2="361" y2="44" stroke="#E5E5E2" stroke-width="0.5"/>
    </g>
    <!-- Row 2 -->
    <g transform="translate(16, 676)">
      <circle cx="16" cy="16" r="16" fill="#E5E5E2"/>
      <text x="16" y="22" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">A</text>
      <text x="44" y="22" font-size="17" fill="#000000">Alpha Compliance</text>
      <line x1="0" y1="44" x2="361" y2="44" stroke="#E5E5E2" stroke-width="0.5"/>
    </g>
    <!-- Row 3 -->
    <g transform="translate(16, 720)">
      <circle cx="16" cy="16" r="16" fill="#E5E5E2"/>
      <text x="16" y="22" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">R</text>
      <text x="44" y="22" font-size="17" fill="#000000">Research Lab</text>
      <line x1="0" y1="44" x2="361" y2="44" stroke="#E5E5E2" stroke-width="0.5"/>
    </g>
    <!-- Sign out row -->
    <g transform="translate(16, 764)">
      <text x="0" y="22" font-size="17" fill="#6B6B68">Sign out</text>
    </g>
  </g>

  <rect x="129.5" y="841" width="134" height="5" rx="2.5" fill="#000000"/>
  <text x="16" y="838" font-size="9" fill="#FAFAF7" opacity="0.6">Calm — Workspace switcher (T4 = A: top-left avatar → sheet)</text>
</svg>
